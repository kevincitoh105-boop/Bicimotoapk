name: APK Cuba +53

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnosticar identidad original y configuración DCloud
        shell: bash
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "=== FIRMA ORIGINAL ==="
          "$BT/apksigner" verify --verbose --print-certs app-release-latest.apk || true
          echo "=== IDENTIDAD ANDROID ==="
          "$BT/aapt" dump badging app-release-latest.apk | head -5 || true
          echo "=== ARCHIVOS DCloud/UNI-APP ==="
          unzip -Z1 app-release-latest.apk | grep -Ei 'manifest.json|dcloud_control.xml|.*\.xml$|app-view.js|app-service.js' | head -80 || true
          echo "=== APPID / APPKEY: solo presencia, sin revelar valores ==="
          python3 - <<'PY'
          import zipfile,re
          z=zipfile.ZipFile("app-release-latest.apk")
          pats=[b'__UNI__',b'DCLOUD_APPKEY',b'appkey',b'appKey',b'appid',b'appId']
          for n in z.namelist():
              if not (n.endswith(('.xml','.json','.js','.txt')) or 'dcloud' in n.lower()):
                  continue
              try: b=z.read(n)
              except: continue
              found=[p.decode() for p in pats if re.search(p, b.decode('utf-8','ignore'), re.I)]
              if found:
                  print(n, "=>", ", ".join(found))
                  if n.endswith(('manifest.json','dcloud_control.xml','dcloud_properties.xml')):
                      content=b.decode('utf-8','ignore')
                      content=re.sub(r'(?i)(appkey\\s*[=:]\\s*)["\\']?[^,"\\'\\s}]+',r'\\1[REDACTED]',content)
                      print(content[:2500])
          print("=== MANIFEST META-DATA ===")
          import subprocess
          q=subprocess.run([__import__('glob').glob(__import__('os').environ['ANDROID_HOME']+'/build-tools/*/aapt')[-1],
                            'dump','xmltree','app-release-latest.apk','AndroidManifest.xml'],
                           text=True,capture_output=True)
          for line in q.stdout.splitlines():
              if re.search(r'dcloud|appkey|appid|uniapp',line,re.I): print(line[:300])
          PY

      - name: Verificar APK original
        run: |
          test -s app-release-latest.apk
          unzip -tq app-release-latest.apk

      - name: Parchar APK (+86 -> +53)
        run: python3 patch_apk.py app-release-latest.apk patched-unsigned.apk

      - name: Alinear, firmar y validar APK
        shell: bash
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 patched-unsigned.apk patched-aligned.apk
          "$BT/zipalign" -c -v 4 patched-aligned.apk
          keytool -genkeypair -keystore ks.jks -storepass android -keypass android \
            -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=App Cuba"
          "$BT/apksigner" sign \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --ks ks.jks --ks-pass pass:android --key-pass pass:android \
            --out app-release-cuba53.apk patched-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs app-release-cuba53.apk
          unzip -tq app-release-cuba53.apk
          sha256sum app-release-cuba53.apk
          echo "APK final validada: $(stat -c%s app-release-cuba53.apk) bytes"

      # Artifacto ZIP de respaldo, sin recomprimir la APK.
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-cuba53
          path: app-release-cuba53.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      # Publica también el APK como archivo directo, sin ZIP intermedio.
      - name: Publicar APK descargable directamente
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cuba53-latest
          name: APK Cuba +53 (última versión)
          prerelease: true
          make_latest: true
          overwrite_files: true
          files: app-release-cuba53.apk
